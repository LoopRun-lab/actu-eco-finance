name: Article tous les 2 jours

on:
  schedule:
    # 8h à Paris : 07:00 UTC en hiver, 06:00 UTC en été.
    # Les deux crons tournent chaque jour, mais le script ne publie qu'à partir de 8h
    # (heure de Paris) et seulement si le dernier article date d'au moins 2 jours.
    # Les jours sans publication, le run s'arrête en quelques secondes sans appeler l'API.
    - cron: "0 6 * * *"
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Test sans publication : génère l'article et l'affiche dans le log, sans commit"
        type: boolean
        default: false
      mode:
        description: "Type d'article (vide = alternance automatique)"
        type: choice
        options: ["", "actu", "fond"]
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Générer l'article
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Optionnel : modifier ces réglages dans Settings > Secrets and variables > Actions > Variables
          BLOG_MODEL: ${{ vars.BLOG_MODEL || 'claude-sonnet-5-5' }}
          BLOG_EFFORT: ${{ vars.BLOG_EFFORT || 'medium' }}
          BLOG_INTERVAL_DAYS: ${{ vars.BLOG_INTERVAL_DAYS || '2' }}
          BLOG_MAX_SEARCHES_ACTU: ${{ vars.BLOG_MAX_SEARCHES_ACTU || '2' }}
          BLOG_MAX_SEARCHES_FOND: ${{ vars.BLOG_MAX_SEARCHES_FOND || '2' }}
          BLOG_MODE: ${{ inputs.mode || vars.BLOG_MODE }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python scripts/generate_post.py --not-before 8
          elif [ "${{ inputs.test }}" = "true" ]; then
            python scripts/generate_post.py --dry-run
            cat _preview/*.md
          else
            python scripts/generate_post.py
          fi

      - name: Commit et push
        run: |
          if [ -z "$(git status --porcelain _posts scripts/topics.json)" ]; then
            echo "Aucun nouvel article à publier."
            exit 0
          fi
          git config user.name "blog-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _posts scripts/topics.json
          git commit -m "Article du $(TZ=Europe/Paris date +%Y-%m-%d)"
          git push
