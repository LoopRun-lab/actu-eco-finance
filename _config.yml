# --- Identité du site --------------------------------------------------------
title: "Actu Éco & Finance"
description: "L'actualité économique et les marchés financiers décryptés simplement : inflation, taux, banques centrales, bourse et bases de l'investissement."
lang: fr_FR
locale: fr_FR
author: "La rédaction Actu Éco & Finance"
timezone: Europe/Paris

# À ADAPTER (voir README) : https://<votre-user>.github.io et /<nom-du-repo>
url: "https://looprun-lab.github.io"
baseurl: "/actu-eco-finance"

# --- Thème et plugins (tous supportés nativement par GitHub Pages) ----------
theme: minima
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

permalink: /:year/:month/:day/:title/
show_excerpts: true

minima:
  date_format: "%d/%m/%Y"

header_pages:
  - about.md

# Fichiers à ne pas publier sur le site
exclude:
  - scripts/
  - README.md
  - requirements.txt
  - _preview/
  - .github/
